name: Worker Stability Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-stability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Syntax check entrypoint and Worker
        run: |
          node --check worker-entry.js
          node --check _worker.js

      - name: Validate and bundle with pinned Wrangler
        run: npx --yes wrangler@4.131.1 deploy --dry-run --outdir .wrangler-check

      - name: Guard bundle size
        run: |
          bundle_bytes=$(find .wrangler-check -type f -name '*.js' -printf '%s\n' | awk '{sum += $1} END {print sum + 0}')
          echo "Generated JavaScript bytes: ${bundle_bytes}"
          test "${bundle_bytes}" -gt 0
          test "${bundle_bytes}" -le 1048576

      - name: Exercise health endpoint
        run: |
          node --input-type=module <<'NODE'
          const { default: worker } = await import('./worker-entry.js');
          const base = 'https://example.com';

          const getResponse = await worker.fetch(new Request(`${base}/__health`), {}, {});
          if (getResponse.status !== 200) throw new Error(`GET /__health returned ${getResponse.status}`);
          if ((getResponse.headers.get('content-type') || '').toLowerCase().includes('application/json') === false) throw new Error('Health response is not JSON');
          if (!(getResponse.headers.get('x-request-id') || '').trim()) throw new Error('Health response is missing X-Request-Id');
          const getBody = await getResponse.json();
          if (getBody.ok !== true || getBody.service !== 'edgetunnel') throw new Error('Health response body is invalid');

          const headResponse = await worker.fetch(new Request(`${base}/__health`, { method: 'HEAD' }), {}, {});
          if (headResponse.status !== 200) throw new Error(`HEAD /__health returned ${headResponse.status}`);
          if (!(headResponse.headers.get('x-request-id') || '').trim()) throw new Error('HEAD health response is missing X-Request-Id');

          const postResponse = await worker.fetch(new Request(`${base}/__health`, { method: 'POST' }), {}, {});
          if (postResponse.status !== 405) throw new Error(`POST /__health returned ${postResponse.status}`);
          if (postResponse.headers.get('allow') !== 'GET, HEAD') throw new Error('Health Allow header is invalid');

          console.log('Health endpoint smoke test passed');
          NODE

      - name: Check Worker startup
        run: npx --yes wrangler@4.131.1 check startup
