name: Worker Stability Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Syntax check Worker
        run: node --check _worker.js

      - name: Validate and bundle with pinned Wrangler
        run: npx --yes wrangler@4.131.1 deploy --dry-run --outdir .wrangler-check

      - name: Check Worker startup
        run: npx --yes wrangler@4.131.1 check startup
